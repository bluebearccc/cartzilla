<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên mật khẩu - Cartzilla</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {},
                    borderRadius: {
                        "DEFAULT": "10px",
                        "lg": "16px",
                        "xl": "1.5rem",
                        "full": "999px"
                    },
                    spacing: {
                        '4': '4px',
                        '8': '8px',
                        '12': '12px',
                        '16': '16px',
                        '24': '24px',
                        '32': '32px',
                        '48': '48px',
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        'card': '0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04)'
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] font-body text-[#0F172A] antialiased min-h-screen flex flex-col justify-center items-center p-16">
<!-- TopNavBar (Suppressed intentionally as per rules for transactional/linear screens) -->
<main class="w-full max-w-[440px] px-16 relative">
<!-- Brand / Logo (Simple text logo for transactional flow) -->
<div class="text-center mb-32">
<a class="font-headline text-2xl font-bold text-[#0F172A] inline-block tracking-tight" href="#">Cartzilla</a>
</div>
<!-- Initial Form State Card -->
<div class="bg-white rounded-lg shadow-card p-32 transition-all duration-300" id="forgot-password-form">
<div class="text-center mb-32">
<h1 class="font-headline text-[24px] leading-[32px] font-bold text-[#0F172A] mb-8">Quên mật khẩu</h1>
<p class="font-body text-[14px] leading-[24px] text-[#475569]">Nhập email để nhận liên kết đặt lại mật khẩu.</p>
</div>
<form action="#" class="space-y-24">
<!-- Input Group (with error state example) -->
<div class="space-y-8 relative">
<label class="block font-label text-[14px] font-medium text-[#0F172A]" for="email">Email</label>
<div class="relative">
<input class="block w-full rounded border-[#DC2626] border-2 py-12 px-16 text-[14px] text-[#0F172A] bg-white placeholder-[#94A3B8] focus:border-[#DC2626] focus:ring-0 focus:outline-none transition-colors" id="email" name="email" placeholder="ban@email.com" type="email" value="invalid-email"/>
<div class="absolute inset-y-0 right-0 pr-16 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#DC2626] text-[20px]">error</span>
</div>
</div>
<p class="font-body text-[12px] text-[#DC2626] mt-4 flex items-center gap-4">
                        Email không hợp lệ
                    </p>
</div>
<!-- Action Button -->
<button class="w-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-label font-medium text-[16px] py-12 px-24 rounded transition-colors duration-200 flex justify-center items-center gap-8 group" onclick="showSuccessState()" type="button">
<span>Gửi liên kết</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-32 text-center">
<a class="inline-flex items-center gap-8 font-body text-[14px] text-[#475569] hover:text-[#4F46E5] transition-colors font-medium" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Quay lại đăng nhập
                </a>
</div>
</div>
<!-- Success State Card (Hidden by default) -->
<div class="bg-white rounded-lg shadow-card p-32 text-center transition-all duration-300 hidden opacity-0 scale-95" id="forgot-password-success">
<div class="mx-auto w-64 h-64 bg-[#EEF2FF] rounded-full flex items-center justify-center mb-24">
<span class="material-symbols-outlined filled text-[#4F46E5] text-[32px]">mark_email_read</span>
</div>
<h2 class="font-headline text-[24px] leading-[32px] font-bold text-[#0F172A] mb-12">Đã gửi email!</h2>
<p class="font-body text-[14px] leading-[24px] text-[#475569] mb-32 max-w-[280px] mx-auto">
                Nếu email tồn tại, bạn sẽ nhận được liên kết đặt lại trong vài phút. Liên kết có hiệu lực 30 phút.
            </p>
<div class="space-y-16">
<button class="w-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-label font-medium text-[16px] py-12 px-24 rounded transition-colors duration-200" type="button">
                    Mở email
                </button>
<a class="block w-full text-center font-body text-[14px] text-[#475569] hover:text-[#4F46E5] transition-colors font-medium py-12" href="#">
                    Quay lại đăng nhập
                </a>
</div>
</div>
</main>
<!-- Footer (Suppressed intentionally for clean linear flow) -->
<script>
        function showSuccessState() {
            const formCard = document.getElementById('forgot-password-form');
            const successCard = document.getElementById('forgot-password-success');

            // Hide form
            formCard.style.opacity = '0';
            formCard.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                formCard.classList.add('hidden');
                
                // Show success
                successCard.classList.remove('hidden');
                
                // Trigger reflow
                void successCard.offsetWidth;
                
                successCard.style.opacity = '1';
                successCard.style.transform = 'scale(1)';
            }, 300);
        }
    </script>
</body></html>
