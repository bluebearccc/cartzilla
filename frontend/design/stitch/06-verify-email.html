<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cartzilla - Xác minh email thành công</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Manrope (Headings) & Inter (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            600: '#475569',
                            900: '#0F172A',
                        },
                        indigo: {
                            50: '#EEF2FF',
                            400: '#818CF8',
                            600: '#4F46E5',
                            700: '#4338CA',
                        },
                        green: {
                            50: '#F0FDF4',
                            500: '#22C55E',
                            600: '#16A34A',
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "10px",
                        "lg": "16px",
                        "xl": "24px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        'card': '0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04)',
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-slate-50 font-body text-slate-600 antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Minimal Brand Logo -->
<div class="mb-8">
<h1 class="font-headline text-2xl font-bold text-slate-900 tracking-tight">Cartzilla</h1>
</div>
<!-- Verification Card -->
<main class="w-full max-w-md">
<div class="bg-white rounded-lg shadow-card p-8 md:p-10 text-center flex flex-col items-center">
<!-- Success Icon -->
<div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-green-600 text-4xl">
                    check_circle
                </span>
</div>
<!-- Content -->
<h2 class="font-headline text-2xl md:text-[24px] font-bold text-slate-900 mb-3">
                Xác minh thành công!
            </h2>
<p class="text-slate-600 text-sm md:text-base mb-8">
                Tài khoản của bạn đã được kích hoạt. Bạn hiện có thể đăng nhập và trải nghiệm mua sắm cùng Cartzilla.
            </p>
<!-- Action Button -->
<button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-DEFAULT transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600">
                Đăng nhập ngay
            </button>
</div>
</main>
<!-- Simple Footer for transactional page -->
<footer class="mt-12 text-center text-slate-400 text-xs">
        © 2024 Cartzilla. Tất cả quyền được bảo lưu.
    </footer>
</body></html>
