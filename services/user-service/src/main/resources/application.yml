server:
  port: 8081
spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/cartzilla_user_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    properties.hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-please-32bytes!!}
  access-ttl-ms: 900000
  refresh-ttl-ms: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  reset-password:
    base-url: ${RESET_PASSWORD_BASE_URL:http://localhost:5173/reset-password}
  verify-email:
    base-url: ${VERIFY_EMAIL_BASE_URL:http://localhost:5173/verify-email}
    ttl-seconds: ${VERIFY_EMAIL_TTL_SECONDS:86400}

clients:
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

oauth:
  state-ttl-seconds: ${OAUTH_STATE_TTL_SECONDS:600}
  providers:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}
      scope: openid email profile

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
