server:
  port: 8084
spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5435}/cartzilla_pay_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

payment:
  always-fail: ${ALWAYS_FAIL:false}   # bật true để demo saga rollback

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:CARTZILLA}
  hash-secret: ${VNPAY_HASH_SECRET:CARTZILLAVNPAYHASHSECRET1234567890}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/callback}
  version: 2.1.0
  command: pay
  order-type: other
  locale: vn
  curr-code: VND

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
