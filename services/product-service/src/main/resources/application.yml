server:
  port: 8082
spring:
  application:
    name: product-service
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cartzilla_product}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
