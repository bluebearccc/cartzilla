name: cartzilla

networks:
  cartzilla-net:
    driver: bridge

volumes:
  pg-user-data:
  pg-product-data:
  pg-order-data:
  pg-pay-data:
  pg-notif-data:
  grafana-data:

services:
  # Databases
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_user_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-15432}:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_product_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${PRODUCT_DB_PORT:-5433}:5432"
    volumes:
      - pg-product-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_product_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_order_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_order_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-pay:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_pay_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5435}:5432"
    volumes:
      - pg-pay-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_pay_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-notif:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_notif_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${NOTIF_DB_PORT:-5436}:5432"
    volumes:
      - pg-notif-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_notif_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [ cartzilla-net ]

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_OUTGOING_SMTP: /app/outgoing-smtp.json
    volumes:
      - ./infra/mailhog/outgoing-smtp.json:/app/outgoing-smtp.json
    networks: [ cartzilla-net ]

  # Infra
  eureka-server:
    build: ./infra/eureka-server
    ports:
      - "8761:8761"
    networks: [ cartzilla-net ]

  config-server:
    build: ./infra/config-server
    ports:
      - "8888:8888"
    networks: [ cartzilla-net ]

  api-gateway:
    build: ./infra/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on: [ eureka-server, user-service, product-service, order-service, payment-service ]
    networks: [ cartzilla-net ]

  # Services
  user-service:
    build: ./services/user-service
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/cartzilla_user_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      RESET_PASSWORD_BASE_URL: ${RESET_PASSWORD_BASE_URL:-http://localhost:5173/reset-password}
      VERIFY_EMAIL_BASE_URL: ${VERIFY_EMAIL_BASE_URL:-http://localhost:5173/verify-email}
      VERIFY_EMAIL_TTL_SECONDS: ${VERIFY_EMAIL_TTL_SECONDS:-86400}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-689804866163-apbool4p0qfq9nqkb56opn4epafi0vbq.apps.googleusercontent.com}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/oauth/google/callback}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
      notification-service:
        condition: service_started
    networks: [ cartzilla-net ]

  product-service:
    build: ./services/product-service
    ports:
      - "127.0.0.1:${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/cartzilla_product_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-product:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  order-service:
    build: ./services/order-service
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/cartzilla_order_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  payment-service:
    build: ./services/payment-service
    ports:
      - "127.0.0.1:${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pay:5432/cartzilla_pay_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      ALWAYS_FAIL: ${ALWAYS_FAIL:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/payments/vnpay/callback}
      VNPAY_FRONTEND_RETURN_URL: ${VNPAY_FRONTEND_RETURN_URL:-http://localhost:5173/payment/result}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/payments/vnpay/ipn}
      VNPAY_REFUND_URL: ${VNPAY_REFUND_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_REFUND_ENABLED: ${VNPAY_REFUND_ENABLED:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-pay:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  notification-service:
    build: ./services/notification-service
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notif:5432/cartzilla_notif_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@cartzilla.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      APP_GMAIL_USERNAME: ${MAIL_USERNAME:-}
      APP_GMAIL_PASSWORD: ${MAIL_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-notif:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mailhog:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [ cartzilla-net ]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [ cartzilla-net ]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api-gateway:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks: [ cartzilla-net ]
