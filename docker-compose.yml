name: cartzilla

networks:
  cartzilla-net:
    driver: bridge

volumes:
  pg-user-data:
  pg-order-data:
  pg-pay-data:
  pg-notif-data:
  pg-product-data:
  grafana-data:

services:
  # ── Databases ─────────────────────────────────
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_user_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: [ "5433:5432" ]
    volumes: [ "pg-user-data:/var/lib/postgresql/data" ]
    networks: [ cartzilla-net ]

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_order_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: [ "5434:5432" ]
    volumes: [ "pg-order-data:/var/lib/postgresql/data" ]
    networks: [ cartzilla-net ]

  postgres-pay:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_pay_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: [ "5435:5432" ]
    volumes: [ "pg-pay-data:/var/lib/postgresql/data" ]
    networks: [ cartzilla-net ]

  postgres-notif:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_notif_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: [ "5436:5432" ]
    volumes: [ "pg-notif-data:/var/lib/postgresql/data" ]
    networks: [ cartzilla-net ]

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_product_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: [ "5437:5432" ]
    volumes: [ "pg-product-data:/var/lib/postgresql/data" ]
    networks: [ cartzilla-net ]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: [ "5672:5672", "15672:15672" ]
    networks: [ cartzilla-net ]

  mailhog:
    image: mailhog/mailhog
    ports: [ "1025:1025", "8025:8025" ]
    networks: [ cartzilla-net ]

  # ── Infra ─────────────────────────────────────
  eureka-server:
    build: ./infra/eureka-server
    ports: [ "8761:8761" ]
    networks: [ cartzilla-net ]

  config-server:
    build: ./infra/config-server
    ports: [ "8888:8888" ]
    networks: [ cartzilla-net ]

  api-gateway:
    build: ./infra/api-gateway
    ports: [ "8080:8080" ]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-please-32bytes!!}
    depends_on: [ eureka-server, user-service, product-service, order-service, payment-service ]
    networks: [ cartzilla-net ]

  # ── Services ──────────────────────────────────
  user-service:
    build: ./services/user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/cartzilla_user_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-please-32bytes!!}
    depends_on: [ postgres-user, eureka-server ]
    networks: [ cartzilla-net ]

  product-service:
    build: ./services/product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/cartzilla_product_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on: [ postgres-product, rabbitmq, eureka-server ]
    networks: [ cartzilla-net ]

  order-service:
    build: ./services/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/cartzilla_order_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on: [ postgres-order, rabbitmq, eureka-server ]
    networks: [ cartzilla-net ]

  payment-service:
    build: ./services/payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pay:5432/cartzilla_pay_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      ALWAYS_FAIL: ${ALWAYS_FAIL:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on: [ postgres-pay, rabbitmq, eureka-server ]
    networks: [ cartzilla-net ]

  notification-service:
    build: ./services/notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notif:5432/cartzilla_notif_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on: [ postgres-notif, rabbitmq, mailhog, eureka-server ]
    networks: [ cartzilla-net ]

  # ── Monitoring ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes: [ "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml" ]
    ports: [ "9090:9090" ]
    networks: [ cartzilla-net ]

  grafana:
    image: grafana/grafana:latest
    ports: [ "3100:3000" ]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [ "grafana-data:/var/lib/grafana" ]
    networks: [ cartzilla-net ]
