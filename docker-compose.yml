name: cartzilla

networks:
  cartzilla-net:
    driver: bridge

volumes:
  pg-user-data:
  pg-product-data:
  pg-order-data:
  pg-pay-data:
  pg-notif-data:
  grafana-data:

services:
  # Databases
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_user_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${USER_DB_PORT:-5432}:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_product_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${PRODUCT_DB_PORT:-5433}:5432"
    volumes:
      - pg-product-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_product_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_order_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_order_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-pay:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_pay_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${PAYMENT_DB_PORT:-5435}:5432"
    volumes:
      - pg-pay-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_pay_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  postgres-notif:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartzilla_notif_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${NOTIF_DB_PORT:-5436}:5432"
    volumes:
      - pg-notif-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d cartzilla_notif_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ cartzilla-net ]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [ cartzilla-net ]

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [ cartzilla-net ]

  # Infra
  eureka-server:
    build: ./infra/eureka-server
    ports:
      - "8761:8761"
    networks: [ cartzilla-net ]

  config-server:
    build: ./infra/config-server
    ports:
      - "8888:8888"
    networks: [ cartzilla-net ]

  api-gateway:
    build: ./infra/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-please-32bytes!!}
    depends_on: [ eureka-server, user-service, product-service, order-service, payment-service ]
    networks: [ cartzilla-net ]

  # Services
  user-service:
    build: ./services/user-service
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/cartzilla_user_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-please-32bytes!!}
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  product-service:
    build: ./services/product-service
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/cartzilla_product_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-product:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  order-service:
    build: ./services/order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/cartzilla_order_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  payment-service:
    build: ./services/payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pay:5432/cartzilla_pay_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      ALWAYS_FAIL: ${ALWAYS_FAIL:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-pay:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  notification-service:
    build: ./services/notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notif:5432/cartzilla_notif_db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-notif:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mailhog:
        condition: service_started
      eureka-server:
        condition: service_started
    networks: [ cartzilla-net ]

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [ cartzilla-net ]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [ cartzilla-net ]
