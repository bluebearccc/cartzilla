server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # SECURITY: tắt auto-route theo service-id. Nếu bật, gateway sinh route
              # /{service-id}/** KHÔNG qua filter JwtAuth → bypass xác thực/role và lộ
              # các endpoint nội bộ /api/internal/**. Chỉ dùng explicit routes bên dưới.
              enabled: false
              lower-case-service-id: true
          routes:
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/register,/api/users/login,/api/users/refresh-token,/api/users/logout,/api/users/forgot-password,/api/users/reset-password,/api/users/verify-email,/api/users/resend-verification,/api/oauth/**
            - id: user-service-protected
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/me,/api/users/me/**,/api/vouchers/**,/api/admin/users/**,/api/admin/vouchers/**
              filters:
                - JwtAuth
            - id: product-service-admin
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/admin/products/**,/api/admin/categories/**,/api/admin/vendors/**
              filters:
                - JwtAuth
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/vendors/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**,/api/staff/orders/**
              filters:
                - JwtAuth
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-please-32bytes!!}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
